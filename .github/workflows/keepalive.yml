name: Keep the app awake

# Streamlit Community Cloud sleeps an app after about 12 hours without a
# visitor, so twice a day keeps it awake. Times are UTC and deliberately off the
# hour, since GitHub delays jobs scheduled on the hour.
on:
  schedule:
    - cron: "23 7,19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install --quiet playwright==1.47.0
          python -m playwright install --with-deps chromium

      # A plain HTTP request does not count as a visit: a sleeping app answers
      # it with 200 and its "gone to sleep" page, so a curl check passes while
      # the app stays asleep. Only a browser that runs the page and opens the
      # app's websocket counts, and waking a sleeping app takes a button press.
      - name: Open the app in the browser
        shell: python
        run: |
          import os, sys
          from playwright.sync_api import TimeoutError, sync_playwright

          url = os.environ["URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)

              wake = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  wake.wait_for(timeout=20_000)
              except TimeoutError:
                  print("the app was awake")
              else:
                  wake.click()
                  print("the app was asleep; woke it")

              # The app itself runs in an iframe; it has loaded once Streamlit
              # has rendered its root element inside it.
              app = page.frame_locator("iframe[title='streamlitApp']").locator("[data-testid='stApp']")
              try:
                  app.wait_for(timeout=300_000)
              except TimeoutError:
                  print(f"::error::{url} did not load within five minutes")
                  sys.exit(1)
              page.wait_for_timeout(10_000)
              print("the app loaded")
        env:
          URL: https://doc--engine.streamlit.app/
