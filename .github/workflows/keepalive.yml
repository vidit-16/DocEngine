name: Keep the app awake

# Streamlit Community Cloud sleeps an app after a few days idle, so twice a day
# is plenty to keep it awake. Times are UTC and deliberately off the hour, since
# GitHub delays jobs scheduled on the hour.
on:
  schedule:
    - cron: "23 7,19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the app
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 -L "$URL" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::warning::$URL did not return 200 after three attempts"
        env:
          URL: https://doc--engine.streamlit.app/
