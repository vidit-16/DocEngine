[project]
name = "docengine"
version = "0.2.0"
description = "Ask questions about any PDF: a small RAG app with hybrid retrieval and page-cited sources."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["docengine"]
